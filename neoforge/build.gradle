architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named('shadowJar', Jar), 'frostbite.accesswidener')
    }

    runs {
        client {
            client()
            property 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }

        clientData {
            clientData()
            programArgs '--mod', rootProject.mod_id, '--all',
                    '--output', project(':common').file('src/main/generated/resources').absolutePath,
                    '--existing', project(':common').file('src/main/resources').absolutePath
        }
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

sourceSets {
    main {
        resources.srcDir project(':common').file('src/main/generated/resources').absolutePath
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
}
